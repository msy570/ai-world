<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI World V4 — Civilization Sandbox</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>AI World V4</h1><small>Civilization Sandbox — crée, observe, détruis, recommence.</small></div>
<div class="top"><button id="play">▶</button><button id="pause">⏸</button><button id="new">↻ Monde</button>
<label>Vitesse <select id="speed"><option value="1">×1</option><option value="2">×2</option><option value="5">×5</option><option value="10">×10</option><option value="25">×25</option><option value="50">×50</option><option value="100">×100</option></select></label>
<label>Temps <select id="timeScale"><option value="1">1 min/tick</option><option value="5">5 min/tick</option><option value="30">30 min/tick</option><option value="120">2 h/tick</option><option value="720">12 h/tick</option><option value="1440">1 jour/tick</option></select></label>
<button id="cinema">🎥 Spectateur</button></div></header>
<main><section class="stage"><div class="tools">
<select id="tool"><option value="select">👆 Sélection</option><option value="wall">🧱 Mur</option><option value="erase">💥 Effacer mur</option><option value="food">🌾 Nourriture</option><option value="wood">🪵 Bois</option><option value="ore">⛏ Minerai</option><option value="water">💧 Eau</option><option value="forest">🌲 Forêt</option></select>
<button id="breakWalls">Détruire tous les murs</button><button id="war">⚔ Guerre globale</button><button id="peace">☮ Paix</button>
<select id="disaster"><option value="">Catastrophe…</option><option value="famine">Famine</option><option value="plague">Épidémie</option><option value="fire">Incendie</option><option value="storm">Tempête</option><option value="meteor">Météorite</option></select><button id="trigger">Déclencher</button>
</div><canvas id="c" width="1280" height="720"></canvas>
<div class="bar"><b id="clock"></b><span id="weather"></span><span id="season"></span><span id="selected">Aucune sélection</span></div></section>
<aside>
<section><h2>🌍 Monde</h2><label>Météo <input id="weatherRate" type="range" min="0" max="100" value="35"><i id="weatherRateV"></i></label>
<label>Ressources <input id="resources" type="range" min="25" max="200" value="100"><i id="resourcesV"></i></label>
<label>Puissance catastrophe <input id="disasterPower" type="range" min="1" max="100" value="45"><i id="disasterPowerV"></i></label>
<label><input id="births" type="checkbox" checked> Naissances</label><label><input id="disease" type="checkbox" checked> Maladies</label><label><input id="trade" type="checkbox" checked> Commerce</label></section>
<section><h2>🏛 Civilisations</h2><div id="civTabs"></div><button id="addCiv">＋ civilisation</button><button id="removeCiv">− civilisation</button>
<div id="civEditor">
<label>Nom <input id="civName" type="text"></label>
<label>Intelligence <input id="intel" type="range" min="0" max="100"><i id="intelV"></i></label>
<label>Agressivité <input id="agg" type="range" min="0" max="100"><i id="aggV"></i></label>
<label>Discipline <input id="disc" type="range" min="0" max="100"><i id="discV"></i></label>
<label>Curiosité <input id="curiosity" type="range" min="0" max="100"><i id="curiosityV"></i></label>
<label>Coopération <input id="coop" type="range" min="0" max="100"><i id="coopV"></i></label>
<label>Fertilité <input id="fertility" type="range" min="0" max="100"><i id="fertilityV"></i></label>
<label>Courage <input id="courage" type="range" min="0" max="100"><i id="courageV"></i></label>
<div class="metrics"><span>👥 <b id="pop"></b></span><span>🔬 <b id="science"></b></span><span>⚙ <b id="tech"></b></span><span>⚔ <b id="military"></b></span><span>🏘 <b id="cities"></b></span><span>💰 <b id="wealth"></b></span></div></div></section>
<section><h2>🧬 Technologies</h2><div id="techTree" class="tree"></div></section>
<section><h2>📜 Événements</h2><div id="log"></div></section>
</aside></main><script src="game.js"></script></body></html>
